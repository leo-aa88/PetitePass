name: Bug report
description: Report a defect in PetitePass
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug.

        **Do not report security vulnerabilities here.** For anything that could
        expose or lose credentials, follow [SECURITY.md](https://github.com/leo-aa88/PetitePass/blob/main/SECURITY.md) instead.

        **Never paste your master password, a real password, or a real vault file.**
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I tested against the latest `main`.
          required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps. A failing test or minimal script is ideal.
      placeholder: |
        1. …
        2. …
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 24.04, macOS 14, Windows 11
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.12.3
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How did you install PetitePass?
      placeholder: e.g. pip install ., make build, run from checkout
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Any error output. Redact anything sensitive.
      render: shell
    validations:
      required: false
