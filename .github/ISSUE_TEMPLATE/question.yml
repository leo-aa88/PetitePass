name: Question
description: Ask a question about using or building PetitePass
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Before asking, the [Tutorial](https://github.com/leo-aa88/PetitePass/blob/main/docs/TUTORIAL.md)
        and [Design doc](https://github.com/leo-aa88/PetitePass/blob/main/docs/DESIGN.md)
        may already have your answer.

        **Never paste your master password, a real password, or a real vault file.**
        This is not the place for security reports — see [SECURITY.md](https://github.com/leo-aa88/PetitePass/blob/main/SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to do? What have you already tried or read?
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system (if relevant)
      placeholder: e.g. Ubuntu 24.04, macOS 14, Windows 11
    validations:
      required: false
