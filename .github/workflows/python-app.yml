name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Lint
      run: ruff check src tests
    - name: Type-check
      run: mypy
    - name: Dependency audit
      run: pip-audit -r requirements.txt
    - name: Run tests
      run: python -m pytest tests -q
    - name: Headless GUI smoke test
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3
        QT_QPA_PLATFORM=offscreen python tests/smoke_gui.py
    - name: Packaged install check
      # Install the real artifact and verify the entry point and bundled data
      # from the INSTALLED package (run from a temp dir so src/ is not on path).
      run: |
        pip install .
        cd "$RUNNER_TEMP"
        python - <<'PY'
        from importlib.metadata import entry_points
        names = [e.name for e in entry_points(group="gui_scripts")]
        assert "petitepass" in names, names
        from petitepass.core.paths import common_password_file
        from petitepass.core.strength import is_common
        assert common_password_file() is not None, "bundled wordlist missing from wheel"
        assert is_common("password"), "common-password list not readable from install"
        print("packaged install OK:", names)
        PY
