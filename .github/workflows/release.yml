# Build the PetitePass GUI into a standalone single-file binary for Linux,
# macOS, and Windows, and publish a GitHub Release.
#
# - On every pull request, the OS matrix is built as a DRY RUN (no tag, no
#   publish) so a packaging break is caught before merge.
# - A release is cut manually via workflow_dispatch (choose a semver bump), or
#   by pushing a v*.*.* tag.
#
#   Git tags are the source of truth for release versions. main is protected
#   (changes must go through a PR), so a release never commits to it: the
#   dispatch path computes the next version from the latest v*.*.* tag and
#   pushes ONLY that tag. The binary is version-stamped from the tag at build
#   time, so `petitepass --version` and the published artifacts match the tag.
#   The committed src/petitepass/__init__.py version is only the floor used for
#   source installs between releases; bump it in a normal PR when you want
#   `pip install .` to report a newer number.
#
# PyInstaller cannot cross-compile, so each OS is built on its own native
# runner. The bundled common-password list is added via --add-data (the src:dest
# separator is ':' on POSIX and ';' on Windows).
name: Release

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump over the latest vX.Y.Z release tag"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

# Read-only by default: the PR dry run only builds and uploads artifacts. The
# version and publish jobs elevate to contents: write for the tag push / release.
permissions:
  contents: read

concurrency:
  # Group by source branch (PR) or ref (tag) so superseded runs are cancelled.
  group: release-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Resolve version
    # Skipped on pull_request (dry run needs no tag).
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # pushes the release tag (never commits to main)
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Gate the release on the same checks CI runs on main. (The GUI smoke test
      # stays in python-app.yml; this is the non-Qt gate.)
      - name: Lint, type-check, test
        run: |
          ruff check src tests
          mypy
          python -m pytest tests -q

      - name: Resolve release version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          init="src/petitepass/__init__.py"

          read_file_version() {
            python -c "import re,sys; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('$init').read()).group(1))"
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch --tags --force
            # Base the bump on the highest existing v*.*.* tag, falling back to
            # the version declared in __init__.py when there are no tags yet.
            latest=""
            while IFS= read -r t; do
              if [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then latest="$t"; break; fi
            done < <(git tag -l 'v*' --sort=-v:refname)
            if [ -n "$latest" ]; then base="${latest#v}"; else base="$(read_file_version)"; fi

            IFS='.' read -r major minor patch <<< "$base"
            case "${INPUT_BUMP:-patch}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "unknown bump: $INPUT_BUMP" >&2; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
            tag="v${version}"
            echo "Base ${base}, bump ${INPUT_BUMP:-patch} -> ${version}"

            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "tag ${tag} already exists" >&2; exit 1
            fi

            # Tag ONLY. main is protected (changes must go through a PR), so the
            # release must not push a commit to it. The binary is version-stamped
            # from this tag at build time; the tag pushed with GITHUB_TOKEN does
            # not start another workflow run, so no recursion into the tag trigger.
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$tag"
            git push origin "$tag"
          else
            # Tag push: the tag is the source of truth.
            tag="$REF_NAME"
            version="${tag#v}"
          fi

          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: version
    # Runs on PRs (dry run, version skipped) and on releases (version succeeded).
    if: ${{ always() && needs.version.result != 'failure' && needs.version.result != 'cancelled' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
          # macos-13 = Intel, macos-latest = Apple Silicon. Both are shipped.
          # (A single universal2 binary is not possible: PyQt5 has no universal2
          # wheel.) Intel hosted runners can be slow to assign.
          - runner: macos-13
            os: macos
            arch: x86_64
          - runner: macos-latest
            os: macos
            arch: arm64
          - runner: windows-latest
            os: windows
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # On a release, build the tagged tree; on a PR this is empty and the
          # PR head is used.
          ref: ${{ needs.version.outputs.tag }}
          # This job only builds; it never pushes. Do not leave a token in git.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Tags are the source of truth and no version commit lands on main, so
      # stamp the resolved version into the working tree before freezing. Runs
      # only on a real release (version is empty on the PR dry run). Fails closed:
      # if the substitution does not land, the binary would freeze the wrong
      # version while publish names the artifacts after the tag.
      - name: Stamp version
        if: ${{ needs.version.outputs.version != '' }}
        shell: bash
        run: |
          python - "src/petitepass/__init__.py" "${{ needs.version.outputs.version }}" <<'PY'
          import re, sys
          path, version = sys.argv[1], sys.argv[2]
          text = open(path).read()
          new, n = re.subn(r'__version__\s*=\s*"[^"]+"', f'__version__ = "{version}"', text, count=1)
          if n != 1:
              sys.exit(f"failed to stamp __version__ in {path} (matched {n} times)")
          open(path, "w").write(new)
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          sep=":"; bin="petitepass"
          if [ "${{ matrix.os }}" = "windows" ]; then sep=";"; bin="petitepass.exe"; fi
          pyinstaller --onefile --windowed --name petitepass --paths src \
            --add-data "src/petitepass/core/data/10k-most-common.txt${sep}petitepass/core/data" \
            src/petitepass/app.py
          # --onefile emits dist/<bin>; on macOS --windowed also wraps it in a
          # .app, from which we take the executable if the plain file is absent.
          bin_path="dist/${bin}"
          if [ ! -f "$bin_path" ] && [ -x "dist/petitepass.app/Contents/MacOS/petitepass" ]; then
            bin_path="dist/petitepass.app/Contents/MacOS/petitepass"
          fi
          test -s "$bin_path"
          mkdir -p staging
          cp "$bin_path" "staging/${bin}"

      # --selftest is Qt-free and performs a real SQLCipher create/add/reopen/read
      # round-trip, so it proves the native encryption extension AND the bundled
      # wordlist actually work inside the frozen binary on this platform.
      - name: Verify binary (POSIX)
        if: ${{ matrix.os != 'windows' }}
        shell: bash
        env:
          EXPECT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ver="$(staging/petitepass --version)"
          echo "$ver"
          # On a real release, the frozen binary MUST report the tag version.
          if [ -n "$EXPECT_VERSION" ] && [ "$ver" != "petitepass ${EXPECT_VERSION}" ]; then
            echo "version mismatch: expected 'petitepass ${EXPECT_VERSION}', got '$ver'" >&2
            exit 1
          fi
          out="$(staging/petitepass --selftest)"
          echo "$out"
          case "$out" in
            "selftest OK:"*) ;;
            *) echo "selftest failed: $out" >&2; exit 1 ;;
          esac

      - name: Verify binary (Windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          # --windowed detaches stdout, so capture the exit code instead:
          # Start-Process -Wait blocks even for a GUI-subsystem exe, and
          # --selftest returns 0 only if the SQLCipher round-trip succeeded.
          $p = Start-Process -FilePath "staging\petitepass.exe" `
                 -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "selftest exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: petitepass-${{ matrix.os }}-${{ matrix.arch }}
          path: staging/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}

  publish:
    name: Publish release
    # Only on a real release, never on a PR dry run.
    if: ${{ github.event_name != 'pull_request' }}
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # creates the GitHub Release
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package archives
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          out="$PWD/dist"
          for dir in artifacts/petitepass-*; do
            platform="$(basename "$dir")"; platform="${platform#petitepass-}"
            if [ -f "$dir/petitepass.exe" ]; then
              (cd "$dir" && zip -q "$out/petitepass-${VERSION}-${platform}.zip" petitepass.exe)
            else
              chmod +x "$dir/petitepass"
              tar -czf "$out/petitepass-${VERSION}-${platform}.tar.gz" -C "$dir" petitepass
            fi
          done
          (cd dist && sha256sum ./* | sed 's|\./||' | tee SHA256SUMS.txt)
          ls -l dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
