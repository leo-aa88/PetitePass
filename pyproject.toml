[project]
name = "petitepass"
dynamic = ["version"]
description = "Simple and secure lightweight password manager (SQLCipher + PyQt5)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Leonardo Araujo", email = "leonardo.aa88@gmail.com" }]
dependencies = [
    "PyQt5==5.15.11",
    "peewee==4.5.3",
    "platformdirs==4.12.4",
    "sqlcipher3==0.6.4",
    "zxcvbn==4.5.0",
]

[project.urls]
Homepage = "https://github.com/leo-aa88/PetitePass"

# gui-scripts (not scripts/console_scripts): PetitePass is a Qt GUI, so on
# Windows the launcher must not attach a console window.
[project.gui-scripts]
petitepass = "petitepass.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "petitepass.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"petitepass.core" = ["data/*.txt"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: real errors and pyflakes. I: import ordering.
# BLE001 (blind except) is not enabled because the broad `except Exception`
# handlers in `Vault.create` / `rekey` / `restore_from` are deliberate (so a
# non-DatabaseError, e.g. a NUL master's ValueError, cannot leave a half-written
# vault file), as is the best-effort `_safe_close`. GUI slots catch `VaultError`
# only. N999 is not enabled because the camelCase GUI module names are a
# pre-existing convention.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
# Type-checking is scoped to the logic core. The GUI (PyQt5) ships no type
# information, so checking it would be noise, not signal.
files = ["src/petitepass/core"]
python_version = "3.10"
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Third-party packages without type stubs.
module = ["peewee", "playhouse.*", "sqlcipher3.*", "zxcvbn", "platformdirs"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
